<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b29">
  <title>宇宙骑行俱乐部 · Rocket Bicycle</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #f7f0df; background: #101b29; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow-x: hidden; }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #a0ead6; outline-offset: 6px; }
    .world { position: relative; min-height: 680px; height: 100svh; overflow: hidden; background: radial-gradient(ellipse at 68% 52%, #29474b 0, #192d3b 34%, #101b29 72%); }
    .world::after { content: ""; pointer-events: none; position: absolute; inset: 18px; border: 1px solid #edf5ec14; border-radius: 16px; z-index: 3; }
    #scene { position: absolute; inset: 0; z-index: 1; touch-action: none; cursor: grab; }
    #scene:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; }
    .masthead { position: absolute; top: 49px; left: 58px; right: 58px; display: flex; align-items: center; justify-content: space-between; z-index: 4; pointer-events: none; }
    .brand { display: flex; gap: 13px; align-items: center; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid #f7f0df70; border-radius: 50%; font-size: 23px; transform: rotate(-28deg); }
    .brand strong { display: block; font-size: 13px; font-weight: 600; letter-spacing: 3px; }
    .brand small { display: block; margin-top: 6px; color: #9aabb3; font-size: 8px; letter-spacing: 2.7px; }
    .edition { color: #9aabb3; font-size: 10px; letter-spacing: 2px; }
    .intro { position: absolute; top: 26%; left: 8%; z-index: 2; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 9px; color: #f4c571; font-size: 10px; letter-spacing: 3px; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #f4c571; box-shadow: 0 0 15px #f4c57170; }
    h1 { margin: 25px 0 24px; font-size: clamp(58px, 6.5vw, 100px); line-height: 1.13; font-weight: 800; letter-spacing: -5px; }
    h1 span { color: #a0ead6; }
    .intro p { margin: 0; color: #a7b7bc; font-size: 13px; line-height: 2; letter-spacing: 2px; }
    .coordinate { position: absolute; top: 50%; right: 42px; writing-mode: vertical-rl; font-size: 9px; letter-spacing: 3px; color: #80959e; z-index: 2; pointer-events: none; }
    .bottom { position: absolute; left: 8%; right: 8%; bottom: 67px; z-index: 4; display: flex; align-items: end; justify-content: space-between; gap: 24px; pointer-events: none; }
    .caption { margin-bottom: 24px; font-size: 10px; letter-spacing: 2px; color: #a5b7bd; }
    .stats { display: flex; gap: 34px; }
    .stat small { display: block; font-size: 9px; letter-spacing: 2px; color: #8399a2; margin-bottom: 10px; }
    .stat strong { font-family: "Segoe UI", sans-serif; font-weight: 400; font-size: 24px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .stat em { font-size: 10px; font-style: normal; color: #a5b7bd; margin-left: 5px; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: auto; }
    .launch { min-width: 185px; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 26px; padding: 16px 25px; border: 0; border-radius: 32px; color: #172530; background: #f4d49a; box-shadow: 0 6px 30px #0002; cursor: pointer; font-size: 12px; letter-spacing: 2px; transition: transform .2s, background .2s; }
    .launch:hover { transform: translateY(-3px); background: #ffe5b8; }
    .launch[aria-pressed="true"] { background: #a0ead6; }
    .launch:disabled { cursor: wait; opacity: .5; }
    .launch svg { width: 20px; height: 20px; }
    .secondary { display: flex; gap: 18px; }
    .secondary button { border: 0; background: none; color: #a2b6be; padding: 5px; font-size: 10px; letter-spacing: 1px; cursor: pointer; }
    .secondary button:hover { color: #f7f0df; }
    .hint { position: absolute; bottom: 27px; left: 50%; transform: translateX(-50%); color: #79939d; font-size: 9px; letter-spacing: 2px; white-space: nowrap; z-index: 4; pointer-events: none; }
    .status { position: absolute; left: 65%; top: 51%; transform: translate(-50%, -50%); z-index: 5; max-width: 320px; color: #d8e9e4; font-size: 13px; line-height: 1.8; text-align: center; }
    .status.error { padding: 24px; background: #152532ed; border: 1px solid #ffffff20; border-radius: 16px; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      .world { min-height: 620px; }
      .world::after { inset: 10px; }
      .masthead { top: 29px; left: 29px; right: 29px; }
      .brand strong { font-size: 11px; letter-spacing: 2px; }
      .brand small { font-size: 7px; letter-spacing: 1.9px; }
      .brand-mark { width: 33px; height: 33px; }
      .edition { font-size: 8px; }
      .intro { top: 117px; left: 8%; }
      .eyebrow { font-size: 8px; letter-spacing: 2px; }
      h1 { font-size: 51px; letter-spacing: -3px; margin: 16px 0 14px; }
      h1 br { display: none; }
      .intro p { font-size: 11px; letter-spacing: 1px; }
      .intro p br { display: none; }
      .coordinate { right: 25px; font-size: 8px; }
      .bottom { left: 8%; right: 8%; bottom: 60px; gap: 12px; }
      .caption { display: none; }
      .stats { gap: 20px; }
      .stat small { font-size: 8px; letter-spacing: 1px; }
      .stat strong { font-size: 20px; }
      .stat:last-child { display: none; }
      .launch { min-width: 143px; min-height: 48px; padding: 13px 19px; gap: 15px; font-size: 11px; }
      .secondary { gap: 12px; }
      .hint { font-size: 8px; bottom: 25px; letter-spacing: 1px; }
      .status { left: 50%; top: 54%; width: 80%; }
    }
    @media (max-width: 380px) {
      .stat:nth-child(2) { display: none; }
    }
    @media (max-height: 650px) and (min-width: 701px) {
      .world { min-height: 500px; }
      .masthead { top: 30px; }
      .intro { top: 23%; }
      h1 { font-size: 64px; margin: 18px 0; }
      .bottom { bottom: 53px; }
      .caption { margin-bottom: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none !important; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <main class="world">
    <div id="scene" role="img" aria-label="可旋转的 3D 场景：一辆薄荷绿自行车骑在奶白色火箭上，橙色尾焰照亮星空。"></div>
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><div><strong>宇宙骑行俱乐部</strong><small>ORBIT CYCLING CLUB</small></div></div>
      <span class="edition">VOL. 001 / 零重力</span>
    </header>
    <section class="intro">
      <div class="eyebrow">A SMALL RIDE. A GIANT LEAP.</div>
      <h1>骑向<br><span>宇宙。</span></h1>
      <p>给日常一点逃逸速度。<br>下一站，不必在地球。</p>
    </section>
    <span class="coordinate">EST. 2026 — SOMEWHERE BEYOND GRAVITY</span>
    <div class="bottom">
      <div>
        <div class="caption">01 / 一场不太科学的浪漫</div>
        <div class="stats">
          <div class="stat"><small>巡航速度</small><strong id="speed">7.9</strong><em>km/s</em></div>
          <div class="stat"><small>目的地</small><strong>∞</strong><em>未知</em></div>
          <div class="stat"><small>燃料</small><strong>100</strong><em>% 想象力</em></div>
        </div>
      </div>
      <div class="controls">
        <button class="launch" id="boost" aria-pressed="false" disabled><span id="boost-label">点火，加速</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 17 17 7M6 7h11v11"/></svg></button>
        <div class="secondary"><button id="pause" aria-pressed="false" disabled>暂停动画</button><button id="reset" disabled>重置视角 ↺</button></div>
      </div>
    </div>
    <div class="hint">拖动旋转 · 滚轮缩放 · 点击加速，甩掉烦恼</div>
    <div class="status" id="status" role="status">正在组装你的宇宙座驾…</div>
    <noscript><style>#status { display: none; }</style><div class="status error">请启用 JavaScript，查看这个 3D 小宇宙。</div></noscript>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    try {
      const [THREE, { OrbitControls }] = await Promise.all([
        import('three'),
        import('three/addons/controls/OrbitControls.js'),
      ]);
      const host = document.querySelector('#scene');
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      host.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 150);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 9;
      controls.maxDistance = 24;
      controls.minPolarAngle = Math.PI * .13;
      controls.maxPolarAngle = Math.PI * .78;
      controls.rotateSpeed = .65;

      scene.add(new THREE.HemisphereLight(0xd4fff5, 0x283d55, 2.4));
      const key = new THREE.DirectionalLight(0xffe8c8, 4.5);
      key.position.set(-3, 7, 6);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x76d8e2, 3.3);
      rim.position.set(3, 3, -5);
      scene.add(rim);
      const fill = new THREE.DirectionalLight(0xefaa78, 1.5);
      fill.position.set(-5, -1, 1);
      scene.add(fill);

      const material = (color, metalness = 0, roughness = .4) => new THREE.MeshStandardMaterial({ color, metalness, roughness });
      const cream = material('#f5ecce', .12, .32);
      const mint = material('#76dfc1', .3, .26);
      const coral = material('#e97550', .15, .33);
      const rubber = material('#182c37', .03, .66);
      const chrome = material('#bfd2cf', .62, .25);
      const brass = material('#ebbb6c', .55, .3);
      const dark = material('#28404b', .32, .35);
      const leather = material('#c57d4f', .02, .66);
      const glass = new THREE.MeshPhysicalMaterial({ color: '#2b96aa', metalness: .45, roughness: .12, clearcoat: 1 });
      const vehicle = new THREE.Group();
      scene.add(vehicle);

      function mesh(geometry, surface, parent, position = [0, 0, 0]) {
        const object = new THREE.Mesh(geometry, surface);
        object.position.set(...position);
        parent.add(object);
        return object;
      }
      function tube(a, b, radius, surface, parent, segments = 12) {
        const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
        const direction = end.clone().sub(start);
        const object = mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), segments), surface, parent);
        object.position.copy(start.add(end).multiplyScalar(.5));
        object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        return object;
      }
      function ball(radius, surface, parent, position, scale = [1, 1, 1]) {
        const object = mesh(new THREE.SphereGeometry(radius, 28, 18), surface, parent, position);
        object.scale.set(...scale);
        return object;
      }
      function ring(radius, thickness, surface, parent, position = [0, 0, 0]) {
        return mesh(new THREE.TorusGeometry(radius, thickness, 12, 64), surface, parent, position);
      }
      function cylinderX(radiusTop, radiusBottom, length, surface, parent, position) {
        const object = mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, length, 64), surface, parent, position);
        object.rotation.z = -Math.PI / 2;
        return object;
      }

      // The rocket points along +X; the bicycle sits on its upper deck.
      const rocket = new THREE.Group();
      rocket.position.y = -.87;
      vehicle.add(rocket);
      cylinderX(.63, .63, 3.75, cream, rocket, [-.15, 0, 0]);
      const profile = [new THREE.Vector2(0, 1.32)];
      for (let i = 1; i <= 32; i++) {
        const angle = i / 32 * Math.PI / 2;
        profile.push(new THREE.Vector2(.63 * Math.sin(angle), 1.32 * Math.cos(angle)));
      }
      const nose = mesh(new THREE.LatheGeometry(profile.reverse(), 64), coral, rocket, [1.73, 0, 0]);
      nose.rotation.z = -Math.PI / 2;
      cylinderX(.645, .645, .12, brass, rocket, [1.73, 0, 0]);
      cylinderX(.65, .65, .16, coral, rocket, [-1.77, 0, 0]);
      cylinderX(.53, .62, .36, dark, rocket, [-2.16, 0, 0]);
      cylinderX(.43, .54, .22, brass, rocket, [-2.43, 0, 0]);
      cylinderX(.37, .42, .05, rubber, rocket, [-2.55, 0, 0]);

      // Raised porthole, inset glass, and small brass bolts on the visible side.
      ring(.285, .058, brass, rocket, [.68, .02, .589]);
      ball(.25, glass, rocket, [.68, .02, .612], [1, 1, .28]);
      const glint = material('#b9f4ef', .15, .2);
      ball(.06, glint, rocket, [.61, .10, .681], [1, .48, .12]);
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ball(.022, chrome, rocket, [.68 + .286 * Math.cos(a), .02 + .286 * Math.sin(a), .646]);
      }
      for (const x of [-1.58, 1.51]) {
        for (let i = 0; i < 12; i++) {
          const a = i * Math.PI / 6;
          ball(.018, brass, rocket, [x, .636 * Math.cos(a), .636 * Math.sin(a)]);
        }
      }

      const finShape = new THREE.Shape();
      finShape.moveTo(-2.15, .35);
      finShape.lineTo(-2.67, 1.05);
      finShape.quadraticCurveTo(-2.7, 1.2, -2.48, 1.13);
      finShape.lineTo(-1.12, .55);
      finShape.closePath();
      const finGeometry = new THREE.ExtrudeGeometry(finShape, { depth: .09, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: .05, bevelThickness: .04 });
      finGeometry.translate(0, 0, -.045);
      for (const angle of [Math.PI / 2, -Math.PI / 2, Math.PI]) {
        const fin = mesh(finGeometry, coral, rocket);
        fin.rotation.x = angle;
      }

      // A pair of tiny mounting saddles makes the bicycle visibly ride the rocket.
      for (const x of [-1.27, 1.34]) {
        mesh(new THREE.BoxGeometry(.44, .08, .42), brass, vehicle, [x, -.16, .04]);
        tube([x, -.13, -.13], [x, .0, -.13], .035, chrome, vehicle);
        tube([x, -.13, .22], [x, .0, .22], .035, chrome, vehicle);
      }

      const bike = new THREE.Group();
      bike.position.z = .04;
      vehicle.add(bike);
      const wheels = [];
      function wheel(x) {
        const group = new THREE.Group();
        group.position.set(x, .69, 0);
        bike.add(group);
        ring(.75, .087, rubber, group);
        ring(.702, .027, cream, group, [0, 0, .054]);
        ring(.674, .034, mint, group);
        for (let i = 0; i < 20; i++) {
          const a = i * Math.PI / 10;
          tube([0, 0, i % 2 ? -.035 : .035], [.657 * Math.cos(a), .657 * Math.sin(a), 0], .009, chrome, group, 5);
        }
        tube([0, 0, -.15], [0, 0, .15], .076, brass, group);
        mesh(new THREE.BoxGeometry(.11, .042, .04), cream, group, [.44, .37, .045]).rotation.z = .7;
        wheels.push(group);
      }
      wheel(-1.27);
      wheel(1.34);
      const rear = [-1.27, .69, 0], crank = [-.15, .64, 0];
      const seat = [-.55, 1.77, 0], head = [.93, 1.82, 0], lowerHead = [1.03, 1.48, 0];
      for (const [a, b] of [[crank, seat], [seat, head], [lowerHead, crank], [head, lowerHead]]) tube(a, b, .054, mint, bike);
      for (const z of [-.135, .135]) {
        tube([rear[0], rear[1], z], [seat[0], seat[1], z / 3], .034, mint, bike);
        tube([rear[0], rear[1], z], [crank[0], crank[1], z / 3], .035, mint, bike);
        tube([1.03, 1.48, z], [1.34, .69, z], .038, mint, bike);
      }
      tube([-.55, 1.77, 0], [-.65, 2.04, 0], .039, chrome, bike);
      ball(.23, leather, bike, [-.65, 2.07, 0], [1.4, .29, .63]);
      tube([.93, 1.82, 0], [.86, 2.1, 0], .034, chrome, bike);
      tube([.86, 2.1, 0], [1.05, 2.18, 0], .034, chrome, bike);
      tube([1.05, 2.18, -.37], [1.05, 2.18, .37], .033, chrome, bike);
      for (const z of [-.37, .37]) {
        tube([1.05, 2.18, z], [.88, 2.17, z], .057, leather, bike);
      }
      ball(.066, brass, bike, [1.04, 2.22, .18], [1, .65, 1]);
      ball(.105, brass, bike, [1.11, 1.75, 0], [1, .85, 1]);
      ball(.086, cream, bike, [1.183, 1.75, 0], [.24, .8, .8]);

      // Closed chain path, independently rotating cranks, and opposite pedals.
      const chainCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-1.27, .78, .155), new THREE.Vector3(-.15, .84, .155),
        new THREE.Vector3(.05, .64, .155), new THREE.Vector3(-.15, .44, .155),
        new THREE.Vector3(-1.27, .60, .155), new THREE.Vector3(-1.36, .69, .155),
      ], true, 'centripetal');
      mesh(new THREE.TubeGeometry(chainCurve, 64, .014, 6, true), dark, bike);
      ring(.19, .026, brass, bike, [-.15, .64, .175]);
      ring(.083, .021, chrome, bike, [-1.27, .69, .16]);
      const pedals = new THREE.Group();
      pedals.position.set(-.15, .64, 0);
      bike.add(pedals);
      tube([0, 0, -.24], [0, 0, .24], .053, chrome, pedals);
      const pedalPads = [];
      for (const side of [-1, 1]) {
        tube([0, 0, side * .22], [side * .23, 0, side * .22], .03, brass, pedals);
        tube([side * .23, 0, side * .22], [side * .23, 0, side * .34], .024, chrome, pedals);
        pedalPads.push(mesh(new THREE.BoxGeometry(.18, .055, .19), leather, pedals, [side * .23, 0, side * .35]));
      }

      // Layered, rounded exhaust rather than a flat flame texture.
      const flame = new THREE.Group();
      flame.position.set(-2.52, -.87, 0);
      vehicle.add(flame);
      const flameOrange = new THREE.MeshBasicMaterial({ color: '#f58a45' });
      const flameYellow = new THREE.MeshBasicMaterial({ color: '#ffce76' });
      const flameWhite = new THREE.MeshBasicMaterial({ color: '#fff0be' });
      ball(1, flameOrange, flame, [-.83, 0, 0], [1.12, .32, .32]);
      ball(1, flameYellow, flame, [-.45, .02, .12], [.72, .22, .23]);
      ball(1, flameWhite, flame, [-.21, .025, .21], [.40, .12, .12]);
      const engineLight = new THREE.PointLight(0xffa34f, 7, 5);
      engineLight.position.set(-2.9, -.9, .4);
      vehicle.add(engineLight);
      const sparks = [];
      for (let i = 0; i < 14; i++) {
        const spark = ball(.028 + (i % 3) * .01, i % 2 ? flameOrange : flameYellow, vehicle, [0, 0, 0]);
        sparks.push(spark);
      }

      // A reproducible star field keeps every first view composed the same way.
      let seed = 2026;
      const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const starPositions = new Float32Array(330 * 3);
      for (let i = 0; i < starPositions.length; i += 3) {
        starPositions[i] = (random() - .5) * 65;
        starPositions[i + 1] = (random() - .5) * 42;
        starPositions[i + 2] = -8 - random() * 22;
      }
      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: '#b9e1dc', size: .046, transparent: true, opacity: .8, sizeAttenuation: true }));
      scene.add(stars);
      const planet = new THREE.Group();
      planet.position.set(4.6, 3.3, -5);
      planet.rotation.set(.4, .2, -.4);
      scene.add(planet);
      ball(.43, material('#b99e7b', .05, .9), planet, [0, 0, 0]);
      const planetRing = mesh(new THREE.RingGeometry(.59, .84, 80), new THREE.MeshStandardMaterial({ color: '#d9c09b', side: THREE.DoubleSide, roughness: .8 }), planet);
      planetRing.rotation.x = Math.PI / 2;
      const moon = mesh(new THREE.IcosahedronGeometry(.38, 1), material('#668185', .1, .95), scene, [-4.7, -2.4, -3]);
      moon.rotation.set(.2, .4, .3);

      const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
      let paused = motionPreference.matches;
      let boosted = false;
      let thrust = 1;
      let elapsed = 0;
      let lastTime = null;
      let mobile = innerWidth <= 700;
      const pauseButton = document.querySelector('#pause');
      const boostButton = document.querySelector('#boost');
      const syncPause = () => {
        pauseButton.setAttribute('aria-pressed', String(paused));
        pauseButton.textContent = paused ? '继续动画' : '暂停动画';
      };
      syncPause();
      function resetCamera() {
        mobile = host.clientWidth <= 700;
        camera.position.set(mobile ? 6.5 : 7.7, mobile ? 4.1 : 4.9, mobile ? 16.6 : 14.7);
        controls.target.set(0, .35, 0);
        controls.update();
        controls.saveState();
      }
      function resize() {
        const width = host.clientWidth, height = host.clientHeight;
        camera.aspect = width / height;
        // Preserve horizontal framing on narrow screens instead of cropping the rocket.
        camera.fov = mobile ? THREE.MathUtils.radToDeg(2 * Math.atan(.26 / camera.aspect)) : 34;
        camera.clearViewOffset();
        // Shift only the framing; orbit rotation still pivots around the model.
        camera.setViewOffset(width, height, mobile ? 0 : -width * .145, mobile ? -height * .04 : 0, width, height);
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }
      resetCamera();
      resize();
      window.addEventListener('resize', () => {
        if (mobile !== (host.clientWidth <= 700)) resetCamera();
        resize();
      });
      document.querySelector('#reset').addEventListener('click', () => { resetCamera(); resize(); });
      pauseButton.addEventListener('click', () => { paused = !paused; syncPause(); });
      motionPreference.addEventListener('change', event => { paused = event.matches; syncPause(); });
      boostButton.addEventListener('click', () => {
        boosted = !boosted;
        boostButton.setAttribute('aria-pressed', String(boosted));
        document.querySelector('#boost-label').textContent = boosted ? '推进器全开' : '点火，加速';
        document.querySelector('#speed').textContent = boosted ? '42.0' : '7.9';
        if (paused) {
          thrust = boosted ? 1.85 : 1;
          flame.scale.set(thrust, 1, 1);
        }
      });
      renderer.domElement.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        status.textContent = '3D 画面暂时断开，请刷新页面重新出发。';
        status.classList.add('error');
        status.hidden = false;
      });

      function animate(time) {
        requestAnimationFrame(animate);
        const dt = lastTime === null ? 0 : Math.min((time - lastTime) / 1000, .05);
        lastTime = time;
        if (!paused) {
          elapsed += dt;
          thrust = THREE.MathUtils.damp(thrust, boosted ? 1.85 : 1, 4, dt);
          vehicle.position.y = Math.sin(elapsed * 1.4) * .095;
          vehicle.rotation.z = .065 + Math.sin(elapsed * .8) * .022;
          vehicle.rotation.x = Math.sin(elapsed * .65) * .025;
          for (const wheel of wheels) wheel.rotation.z -= dt * 1.5 * thrust;
          pedals.rotation.z -= dt * 1.1 * thrust;
          for (const pad of pedalPads) pad.rotation.z = -pedals.rotation.z;
          flame.scale.set(thrust * (1 + .075 * Math.sin(elapsed * 19)), 1 + .07 * Math.sin(elapsed * 23), 1);
          engineLight.intensity = 7 * thrust;
          stars.rotation.z = elapsed * .003;
          moon.rotation.y += dt * .07;
        }
        for (let i = 0; i < sparks.length; i++) {
          const p = (elapsed * (.6 + i * .013) + i / sparks.length) % 1;
          sparks[i].position.set(-2.8 - p * 3.3 * thrust, -.87 + Math.sin(i * 8.4) * (.15 + p * .3), Math.cos(i * 5.3) * .27);
          sparks[i].scale.setScalar(Math.sin(p * Math.PI) * .85);
        }
        controls.update();
        renderer.render(scene, camera);
      }
      vehicle.rotation.z = .065;
      renderer.render(scene, camera);
      status.hidden = true;
      for (const button of document.querySelectorAll('button')) button.disabled = false;
      requestAnimationFrame(animate);
    } catch (error) {
      console.error('Rocket bicycle could not start:', error);
      status.textContent = '小宇宙暂时没能加载。请检查网络连接，并使用支持 WebGL 的新版浏览器打开页面。';
      status.classList.add('error');
    }
  </script>
</body>
</html>
