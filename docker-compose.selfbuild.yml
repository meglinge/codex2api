# Self-built deployment: build both images on the host from this checkout instead of pulling
# ghcr.io images or relying on GitHub Actions runners.
#
#   git clone --recurse-submodules https://github.com/meglinge/codex2api.git && cd codex2api
#   cp .env.sqlite.example .env            # then edit: C2A_SENDER_TOKEN, ADMIN_SECRET, ...
#   docker compose -f docker-compose.selfbuild.yml up -d --build
#
# codex2api runs with SQLite + in-memory cache; c2a-sender shares its network namespace so the
# loopback link between them never leaves the pod. All Codex upstream traffic (HTTP and
# WebSocket) goes through the sender, i.e. through the CLI's own reqwest / hyper / tungstenite /
# TLS stack.
name: codex2api-selfbuild

services:
  codex2api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-selfbuild}
    image: codex2api:selfbuild
    container_name: codex2api-selfbuild
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CODEX_PORT:-8080}:${CODEX_PORT:-8080}"
    env_file:
      - .env
    environment:
      CODEX_TRANSPORT_MODE: rust
      CODEX_RUST_SENDER_URL: http://127.0.0.1:8799
      CODEX_RUST_SENDER_TOKEN: ${C2A_SENDER_TOKEN:-}
      CODEX_UPSTREAM_TRANSPORT: ${CODEX_UPSTREAM_TRANSPORT:-ws}
    volumes:
      - sqlite-data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${CODEX_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s
    restart: unless-stopped

  sender:
    build:
      context: .
      dockerfile: Dockerfile.sender
    image: codex2api-sender:selfbuild
    container_name: codex2api-sender-selfbuild
    # Same network namespace as codex2api: the sender listens on 127.0.0.1:8799 only.
    network_mode: "service:codex2api"
    environment:
      C2A_SENDER_LISTEN: 127.0.0.1:8799
      C2A_SENDER_TOKEN: ${C2A_SENDER_TOKEN:-}
      C2A_SENDER_LOG: ${C2A_SENDER_LOG:-info}
      CODEX_CA_CERTIFICATE: ${CODEX_CA_CERTIFICATE:-}
    depends_on:
      - codex2api
    restart: unless-stopped

volumes:
  sqlite-data:
    name: codex2api-selfbuild_sqlite-data
