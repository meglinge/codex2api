[package]
name = "c2a-sender"
version = "0.1.0"
edition = "2024"
description = "Loopback HTTP/WebSocket forwarder that sends codex2api's upstream requests through the exact reqwest/hyper/tungstenite/TLS stack the Codex CLI links, so the gateway inherits the CLI's transport fingerprint."
publish = false

[[bin]]
name = "c2a-sender"
path = "src/main.rs"

# Standalone project: the codex sources under ../third_party/codex are a git submodule and
# stay in their own workspace. Cargo.lock is seeded from that workspace so reqwest / hyper /
# tungstenite / rustls / native-tls resolve to the same versions the CLI is built with, and
# the [patch.crates-io] block below mirrors the workspace so the OpenAI tungstenite forks are
# used for the WebSocket path exactly as in the CLI.
[workspace]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1.10.1"
clap = { version = "4", features = ["derive", "env"] }
codex-http-client = { path = "../third_party/codex/codex-rs/http-client" }
codex-utils-rustls-provider = { path = "../third_party/codex/codex-rs/utils/rustls-provider" }
futures = { version = "0.3", default-features = false, features = ["std"] }
http = "1.3.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", features = ["cookies", "json", "rustls-tls-native-roots", "socks", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "0.28.0", features = ["proxy", "rustls-tls-native-roots"] }
tungstenite = { version = "0.27.0", features = ["deflate", "proxy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.release]
strip = true
